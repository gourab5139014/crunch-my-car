name: Tests

# Runs the vitest suite (component tests + the Tier 1 skill lint) so the
# skill-honesty lint is actually enforced on every PR, not just locally.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # fs.promises.glob (skill-lint) is stable on Node 22+
          cache: npm
      - run: npm ci
      - run: npm test
